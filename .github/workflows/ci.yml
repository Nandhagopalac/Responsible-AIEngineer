name: Responsible AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run guardrail tests
      run: |
        python -m guardrails.input_filter
        python -m guardrails.output_validator

    - name: Run redteam fuzz tests
      run: python -m redteam.fuzz_tester

    - name: Run evaluation modules
      run: |
        python -m evaluation.fairness_eval
        python -m evaluation.hallucination_check

    - name: Run governance compliance check
      run: python -m governance.audit_report_generator

    - name: Run observability logger
      run: python -m observability.structured_logger

    - name: Run full pipeline
      run: python main.py
